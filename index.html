<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan QR - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <h1 class="text-xl font-bold text-center text-slate-800">QR Attendance System</h1>

    <!-- Page Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Scan View Content -->
    <div class="space-y-3">
      <div class="relative w-full aspect-square bg-black rounded-xl overflow-hidden flex items-center justify-center">
        <video id="video" class="w-full h-full object-cover" playsinline></video>
        <canvas id="canvas" class="hidden"></canvas>
      </div>
      <p id="cameraStatus" class="text-xs text-center text-slate-400">Requesting camera...</p>
    </div>

    <!-- Student Details Result Card -->
    <div id="resultCard" class="hidden border rounded-2xl p-4 space-y-3 bg-slate-50">
      <div class="flex justify-between items-center">
        <span id="cardClassBadge" class="text-xs font-bold px-3 py-1 rounded-full text-white">Class</span>
        <span id="cardId" class="text-xs font-mono text-slate-400">ID</span>
      </div>
      <h3 id="cardName" class="text-lg font-bold text-slate-800">First Last</h3>
      <button id="btnMarkPresent" onclick="handleMarkPresent()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700">Mark Present</button>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    let videoStream = null;
    let scanningActive = false;
    let activeStudent = null;

    window.addEventListener('DOMContentLoaded', startCamera);

    async function startCamera() {
      stopCamera();
      const video = document.getElementById('video');
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
      } catch (e) {
        try {
          videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        } catch (err) {
          document.getElementById('cameraStatus').innerText = "Camera access denied.";
          return;
        }
      }
      video.srcObject = videoStream;
      video.play();
      scanningActive = true;
      requestAnimationFrame(scanFrame);
      document.getElementById('cameraStatus').innerText = "Scanning active...";
    }

    function stopCamera() {
      scanningActive = false;
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    function scanFrame() {
      if (!scanningActive) return;
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);

        if (code && code.data) {
          scanningActive = false;
          fetchStudent(code.data);
          return;
        }
      }
      requestAnimationFrame(scanFrame);
    }

    async function fetchStudent(id) {
      showAlert('alertBanner', "Searching student...", "blue");
      try {
        const res = await getStudentById(id);
        if (!res.success) {
          showAlert('alertBanner', res.message, "red");
          setTimeout(() => { scanningActive = true; scanFrame(); }, 2000);
          return;
        }
        activeStudent = res.student;
        document.getElementById('cardName').innerText = `${activeStudent.firstName} ${activeStudent.lastName}`;
        document.getElementById('cardId').innerText = `ID: ${activeStudent.id}`;
        const badge = document.getElementById('cardClassBadge');
        badge.innerText = activeStudent.className;
        badge.style.backgroundColor = activeStudent.color || '#3b82f6';
        document.getElementById('resultCard').classList.remove('hidden');
        showAlert('alertBanner', "", "hide");
      } catch (err) {
        showAlert('alertBanner', "Connection error", "red");
      }
    }

    async function handleMarkPresent() {
      if (!activeStudent) return;
      showAlert('alertBanner', "Marking...", "blue");
      try {
        const res = await markAttendance(activeStudent);
        showAlert('alertBanner', res.message, res.success ? "green" : "red");
        if (res.success) {
          document.getElementById('resultCard').classList.add('hidden');
          setTimeout(() => { scanningActive = true; scanFrame(); }, 2000);
        }
      } catch (e) {
        showAlert('alertBanner', "Failed to mark attendance", "red");
      }
    }
  </script>
</body>
</html>
