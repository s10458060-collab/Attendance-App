<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Registration - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <h1 class="text-xl font-bold text-center text-slate-800">QR Attendance System</h1>

    <!-- Page Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-white bg-indigo-600">New Reg</a>
    </nav>

    <!-- Registration Form -->
    <div class="space-y-3 text-sm">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">New Student Registration</h2>

      <!-- Student Details -->
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600">First Name *</label>
          <input type="text" id="regFirst" placeholder="First Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Last Name *</label>
          <input type="text" id="regLast" placeholder="Last Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600">Date of Birth *</label>
          <input type="date" id="regDob" class="w-full border p-2.5 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Class *</label>
          <select id="regClass" class="w-full border p-2.5 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="4 Below">4 Below</option>
            <option value="Part 1A (4-6yrs)">Part 1A (4-6yrs)</option>
            <option value="Part 1B (7+)">Part 1B (7+)</option>
            <option value="Part 1 C (12+)">Part 1 C (12+)</option>
            <option value="Part 2">Part 2</option>
            <option value="Part 3">Part 3</option>
            <option value="Part 4-5">Part 4-5</option>
            <option value="Part 6">Part 6</option>
            <option value="Pronounciation">Pronounciation</option>
          </select>
        </div>
      </div>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-slate-400 text-xs font-bold">PARENT / GUARDIAN INFO</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- Parent Details -->
      <div>
        <label class="text-xs font-semibold text-slate-600">Parent Full Name *</label>
        <input type="text" id="regParentName" placeholder="Parent Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Parent Phone / WhatsApp *</label>
        <input type="tel" id="regParentPhone" placeholder="e.g. +1 416 555 0199" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div>
        <label class="text-xs font-semibold text-slate-600">Parent Email Address</label>
        <input type="email" id="regParentEmail" placeholder="parent@example.com" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button onclick="handleRegistration()" id="btnSubmit" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700 transition shadow-md mt-2">
        Save & Generate Student ID
      </button>
    </div>

    <!-- Generated ID Confirmation Box -->
    <div id="confirmationBox" class="hidden border-2 border-emerald-500 bg-emerald-50 rounded-2xl p-4 text-center space-y-2">
      <span class="text-xs font-bold text-emerald-700 uppercase tracking-wide">Student Created Successfully</span>
      <h3 id="assignedIdText" class="text-2xl font-black text-emerald-900 font-mono">STU000</h3>
      <p id="assignedNameText" class="text-xs text-emerald-800 font-medium">Student Name</p>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    async function handleRegistration() {
      const formData = {
        firstName: document.getElementById('regFirst').value.trim(),
        lastName: document.getElementById('regLast').value.trim(),
        dob: document.getElementById('regDob').value,
        className: document.getElementById('regClass').value,
        parentName: document.getElementById('regParentName').value.trim(),
        parentPhone: document.getElementById('regParentPhone').value.trim(),
        parentEmail: document.getElementById('regParentEmail').value.trim()
      };

      if (!formData.firstName || !formData.lastName || !formData.dob || !formData.parentName || !formData.parentPhone) {
        return showAlert('alertBanner', "Please fill in all required fields marked with *", "red");
      }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Registering...";

      showAlert('alertBanner', "Generating Student ID and saving...", "blue");
      document.getElementById('confirmationBox').classList.add('hidden');

      try {
        const res = await registerStudent(formData);
        
        btn.disabled = false;
        btn.innerText = "Save & Generate Student ID";

        if (res.success) {
          showAlert('alertBanner', "", "hide");
          
          // Show confirmation card with generated ID
          document.getElementById('assignedIdText').innerText = res.studentId;
          document.getElementById('assignedNameText').innerText = `${formData.firstName} ${formData.lastName} (${formData.className})`;
          document.getElementById('confirmationBox').classList.remove('hidden');

          // Reset Form
          document.getElementById('regFirst').value = '';
          document.getElementById('regLast').value = '';
          document.getElementById('regDob').value = '';
          document.getElementById('regParentName').value = '';
          document.getElementById('regParentPhone').value = '';
          document.getElementById('regParentEmail').value = '';
        } else {
          showAlert('alertBanner', res.message, "red");
        }
      } catch (e) {
        btn.disabled = false;
        btn.innerText = "Save & Generate Student ID";
        showAlert('alertBanner', "Registration failed. Check network connection.", "red");
      }
    }
  </script>
</body>
</html>
