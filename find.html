<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Student - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <h1 class="text-xl font-bold text-center text-slate-800">QR Attendance System</h1>

    <!-- Page Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Search Form -->
    <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Search Student</h2>
      
      <div>
        <label class="text-xs font-semibold text-slate-600">Student ID</label>
        <input type="text" id="findIdInput" placeholder="e.g. STU001" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-slate-400 text-xs font-bold">OR BY NAME</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600">First Name</label>
          <input type="text" id="findFirstInput" placeholder="First Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Last Name</label>
          <input type="text" id="findLastInput" placeholder="Last Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <button onclick="handleSearch()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition">Search Student</button>
    </div>

    <!-- Search Results List -->
    <div id="resultsList" class="space-y-3"></div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    async function handleSearch() {
      const id = document.getElementById('findIdInput').value.trim();
      const firstName = document.getElementById('findFirstInput').value.trim();
      const lastName = document.getElementById('findLastInput').value.trim();

      if (!id && !firstName && !lastName) {
        return showAlert('alertBanner', "Please enter a Student ID or Name to search.", "red");
      }

      showAlert('alertBanner', "Searching...", "blue");
      document.getElementById('resultsList').innerHTML = '';

      try {
        const res = await searchStudentsApi({ id, firstName, lastName });
        if (!res.success) {
          showAlert('alertBanner', res.message, "red");
          return;
        }

        showAlert('alertBanner', "", "hide");
        renderResults(res.students);
      } catch (err) {
        showAlert('alertBanner', "Connection error", "red");
      }
    }

    function renderResults(students) {
      const container = document.getElementById('resultsList');
      container.innerHTML = '';

      students.forEach(student => {
        const hexColor = student.color || '#3b82f6';
        const bgColor = hexToRgba(hexColor, 0.12);

        const card = document.createElement('div');
        card.className = "border-2 rounded-2xl p-4 space-y-3 transition-all duration-300";
        card.style.backgroundColor = bgColor;
        card.style.borderColor = hexColor;

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold px-3 py-1 rounded-full text-white shadow-sm" style="background-color: ${hexColor}">${student.className}</span>
            <span class="text-xs font-mono font-bold opacity-75">ID: ${student.id}</span>
          </div>
          <div>
            <h3 class="text-lg font-extrabold text-slate-900">${student.firstName} ${student.lastName}</h3>
            <p class="text-xs font-semibold opacity-80 mt-0.5">${student.className}</p>
          </div>
          <button onclick='markStudentPresent(${JSON.stringify(student)})' class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition text-sm shadow-md">
            Mark Present
          </button>
        `;
        container.appendChild(card);
      });
    }

    function hexToRgba(hex, alpha) {
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16);
      const g = parseInt(cleanHex.substring(2, 4), 16);
      const b = parseInt(cleanHex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function markStudentPresent(student) {
      showAlert('alertBanner', `Marking ${student.firstName}...`, "blue");
      try {
        const res = await markAttendance(student);
        showAlert('alertBanner', res.message, res.success ? "green" : "red");
      } catch (e) {
        showAlert('alertBanner', "Failed to mark attendance", "red");
      }
    }
  </script>
</body>
</html> html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Student - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <h1 class="text-xl font-bold text-center text-slate-800">QR Attendance System</h1>

    <!-- Page Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Search Form -->
    <div class="flex gap-2">
      <input type="text" id="findIdInput" placeholder="Student ID (e.g. STU001)" class="flex-1 border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button onclick="handleManualSearch()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-medium hover:bg-indigo-700">Search</button>
    </div>

    <!-- Result Card -->
    <div id="resultCard" class="hidden border rounded-2xl p-4 space-y-3 bg-slate-50">
      <div class="flex justify-between items-center">
        <span id="cardClassBadge" class="text-xs font-bold px-3 py-1 rounded-full text-white">Class</span>
        <span id="cardId" class="text-xs font-mono text-slate-400">ID</span>
      </div>
      <h3 id="cardName" class="text-lg font-bold text-slate-800">First Last</h3>
      <button id="btnMarkPresent" onclick="handleMarkPresent()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-700">Mark Present</button>
    </div>

    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>
  </div>

  <script>
    let activeStudent = null;

    async function handleManualSearch() {
      const id = document.getElementById('findIdInput').value.trim();
      if (!id) return showAlert('alertBanner', "Please enter a student ID", "red");

      showAlert('alertBanner', "Searching...", "blue");
      document.getElementById('resultCard').classList.add('hidden');

      try {
        const res = await getStudentById(id);
        if (!res.success) {
          showAlert('alertBanner', res.message, "red");
          return;
        }

        activeStudent = res.student;
        document.getElementById('cardName').innerText = `${activeStudent.firstName} ${activeStudent.lastName}`;
        document.getElementById('cardId').innerText = `ID: ${activeStudent.id}`;
        const badge = document.getElementById('cardClassBadge');
        badge.innerText = activeStudent.className;
        badge.style.backgroundColor = activeStudent.color || '#3b82f6';
        
        document.getElementById('resultCard').classList.remove('hidden');
        showAlert('alertBanner', "", "hide");
      } catch (err) {
        showAlert('alertBanner', "Connection error", "red");
      }
    }

    async function handleMarkPresent() {
      if (!activeStudent) return;
      showAlert('alertBanner', "Marking...", "blue");
      try {
        const res = await markAttendance(activeStudent);
        showAlert('alertBanner', res.message, res.success ? "green" : "red");
        if (res.success) {
          document.getElementById('resultCard').classList.add('hidden');
          document.getElementById('findIdInput').value = '';
        }
      } catch (e) {
        showAlert('alertBanner', "Failed to mark attendance", "red");
      }
    }
  </script>
</body>
</html>
