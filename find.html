<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Student - Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="api-config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-5 space-y-4 my-2">
    <h1 class="text-xl font-bold text-center text-slate-800">QR Attendance System</h1>

    <!-- Page Navigation -->
    <nav class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold text-center">
      <a href="index.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">Scan QR</a>
      <a href="find.html" class="py-2.5 rounded-lg text-white bg-indigo-600">Find Student</a>
      <a href="register.html" class="py-2.5 rounded-lg text-slate-600 hover:text-slate-900">New Reg</a>
    </nav>

    <!-- Search Form -->
    <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Search Student</h2>
      
      <div>
        <label class="text-xs font-semibold text-slate-600">Student ID</label>
        <input type="text" id="findIdInput" placeholder="e.g. STU001" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-slate-400 text-xs font-bold">OR BY NAME</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-slate-600">First Name</label>
          <input type="text" id="findFirstInput" placeholder="First Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-600">Last Name</label>
          <input type="text" id="findLastInput" placeholder="Last Name" class="w-full border p-2.5 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <button id="searchBtn" onclick="handleSearch()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition">Search Student</button>
    </div>

    <!-- Alert Message Banner -->
    <div id="alertBanner" class="hidden p-3 rounded-xl text-xs text-center font-semibold"></div>

    <!-- Search Results List -->
    <div id="resultsList" class="space-y-3"></div>
  </div>

  <script>
    // Helper function to safely display alert banners
    function displayAlert(message, type) {
      const banner = document.getElementById('alertBanner');
      if (!banner) return;

      if (type === 'hide' || !message) {
        banner.classList.add('hidden');
        return;
      }

      banner.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700', 'bg-green-100', 'text-green-700');

      if (type === 'red') {
        banner.classList.add('bg-red-100', 'text-red-700');
      } else if (type === 'green') {
        banner.classList.add('bg-green-100', 'text-green-700');
      } else {
        banner.classList.add('bg-blue-100', 'text-blue-700');
      }

      banner.innerText = message;
    }

    // Direct Frontend Color Matcher
    function getClassColorByName(className) {
      if (!className) return '#3b82f6';
      
      const str = String(className).toLowerCase().trim();

      // Part 1C -> Black
      if (str.includes('1c') || str.includes('1 c') || str.includes('part 1c') || str.includes('part 1 c')) {
        return '#000000';
      }

      if (str.includes('below 4') || str.includes('4 below')) return '#3b82f6'; // Blue
      if (str.includes('1a') || str.includes('part 1a'))       return '#ef4444'; // Red
      if (str.includes('1b') || str.includes('part 1b'))       return '#ec4899'; // Pink
      if (str.includes('part 2') || str.includes('part-2') || str.endsWith('2')) return '#f97316'; // Orange
      if (str.includes('part 3') || str.includes('part-3') || str.endsWith('3')) return '#8b5cf6'; // Purple
      if (str.includes('4-5') || str.includes('4/5') || str.includes('part 4'))   return '#10b981'; // Green
      if (str.includes('part 6') || str.includes('part-6') || str.endsWith('6')) return '#eab308'; // Yellow
      if (str.includes('pronou') || str.includes('pronu'))     return '#854d0e'; // Brown

      return '#3b82f6'; // Fallback Default
    }

    async function handleSearch() {
      const id = document.getElementById('findIdInput').value.trim();
      const firstName = document.getElementById('findFirstInput').value.trim();
      const lastName = document.getElementById('findLastInput').value.trim();

      if (!id && !firstName && !lastName) {
        return displayAlert("Please enter a Student ID or Name to search.", "red");
      }

      displayAlert("Searching...", "blue");
      document.getElementById('resultsList').innerHTML = '';

      try {
        const res = await searchStudentsApi({ id, firstName, lastName });
        if (!res || !res.success) {
          displayAlert(res && res.message ? res.message : "No matching students found.", "red");
          return;
        }

        displayAlert("", "hide");
        renderResults(res.students);
      } catch (err) {
        displayAlert("Error searching student. Please try again.", "red");
      }
    }

    function renderResults(students) {
      const container = document.getElementById('resultsList');
      container.innerHTML = '';

      if (!students || students.length === 0) {
        displayAlert("No matching students found.", "red");
        return;
      }

      students.forEach(student => {
        const hexColor = getClassColorByName(student.className);
        const bgColor = hexToRgba(hexColor, 0.08);

        const card = document.createElement('div');
        card.className = "border-2 rounded-2xl p-4 space-y-3 transition-all duration-300 shadow-sm";
        card.style.backgroundColor = bgColor;
        card.style.borderColor = hexColor;

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold px-3 py-1 rounded-full text-white shadow-sm" style="background-color: ${hexColor}">${student.className}</span>
            <span class="text-xs font-mono font-bold" style="color: ${hexColor}">ID: ${student.id}</span>
          </div>
          <div>
            <h3 class="text-lg font-extrabold text-slate-900">${student.firstName} ${student.lastName}</h3>
            <p class="text-xs font-bold mt-0.5" style="color: ${hexColor}">${student.className}</p>
          </div>
          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick='markStudentPresent(${JSON.stringify(student)})' class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-700 transition text-sm shadow-md">
              Mark Present
            </button>
            <button onclick="goToHome()" class="w-full bg-slate-200 text-slate-700 py-2.5 rounded-xl font-bold hover:bg-slate-300 transition text-sm">
              Cancel
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function goToHome() {
      window.location.href = 'index.html';
    }

    function hexToRgba(hex, alpha) {
      const cleanHex = hex.replace('#', '');
      const r = parseInt(cleanHex.substring(0, 2), 16);
      const g = parseInt(cleanHex.substring(2, 4), 16);
      const b = parseInt(cleanHex.substring(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function markStudentPresent(student) {
      displayAlert(`Marking ${student.firstName}...`, "blue");
      try {
        const res = await markAttendance(student);
        if (res && res.success) {
          displayAlert(`${res.message || 'Marked present'}. Redirecting...`, "green");
          setTimeout(() => {
            goToHome();
          }, 1200);
        } else {
          displayAlert(res ? res.message : "Failed to mark attendance", "red");
        }
      } catch (e) {
        displayAlert("Failed to mark attendance", "red");
      }
    }
  </script>
</body>
</html>
